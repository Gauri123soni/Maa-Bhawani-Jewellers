<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account | Maa Bhawani Jewellers</title>

    <link rel="stylesheet"
          href="../styles.css">

    <link rel="stylesheet"
          href="../css/auth.css">

</head>


<body>

<main class="auth-container">

    <form class="auth-box" id="registerForm">

        <h1>Create Account</h1>


        <label for="name">Full name</label>
        <input
            type="text"
            id="name"
            name="name"
            autocomplete="name"
            required
        >


        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            required
        >


        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            minlength="8"
            autocomplete="new-password"
            required
        >


        <button type="submit">
            Register
        </button>


        <p id="message" role="status" aria-live="polite"></p>


        <p>
            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>


        <a href="../index.html">
            ← Back to Home
        </a>

    </form>

</main>


<script src="../js/auth.js"></script>

</body>

</html>
