<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Panel</title>

    <link rel="stylesheet"
          href="../styles.css">

    <link rel="stylesheet"
          href="../css/admin.css">

</head>


<body>

<div class="admin-container">

    <h1>⚙ Admin Panel</h1>

    <p>
        Maa Bhawani Jewellers
    </p>


    <!-- UPDATE RATE -->

    <div class="admin-card">

        <h2>
            Update Metal Rate
        </h2>


        <label>Metal</label>

        <select id="adminMetal">

            <option value="gold">
                Gold
            </option>

            <option value="silver">
                Silver
            </option>

        </select>


        <label>Purity</label>

        <select id="adminPurity">

            <option value="24">
                24K
            </option>

            <option value="22">
                22K
            </option>

            <option value="18">
                18K
            </option>

        </select>


        <label>Rate</label>

        <input
            type="number"
            id="adminRate"
            placeholder="Enter rate"
        >


        <button onclick="updateRate()">
            Update Rate
        </button>


        <p id="adminMessage"></p>

    </div>


    <!-- ORDER -->

    <div class="admin-card">

        <h2>
            Track Order
        </h2>


        <input
            type="text"
            id="orderCode"
            placeholder="Order ID"
        >


        <button onclick="trackOrder()">
            Search Order
        </button>


        <div id="trackingResult"></div>

    </div>


    <br>


    <a
        href="../index.html"
        class="btn"
    >
        Back to Website
    </a>

</div>


<script src="../js/admin.js"></script>

</body>

</html>
